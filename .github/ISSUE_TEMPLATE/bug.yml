name: Bug report
description: Report a reproducible PageTrail capture, export or replay problem.
title: "[Bug]: "
labels: ["bug"]
body:
  # Version number
  - type: input
    id: version
    attributes:
      label: PageTrail version
      description: Find this on the extension card or PageTrail dashboard.
      placeholder: "0.1.2-beta.1"
    validations:
      required: true
  # What did the user expect to happen? What was the actual behavior?
  - type: textarea
    attributes:
      label: What did you expect to happen? What happened instead?
      description: |
        Explain the expected result and what PageTrail produced instead.

        Use invented or public sample content. Do not attach private recordings,
        confidential pages, credentials, browser profiles or unreviewed diagnostics.
    validations:
      required: true
  # Step-by-step reproduction instructions
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, browser version, operating system and installation type.
      placeholder: "Edge 130, macOS 15, unpacked extension"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Recording session
        - Controlled crawl
        - Website-session HTML
        - Portable learning ZIP
        - Markdown or text HTML
        - WACZ or local reader
        - Installation or upgrade
        - Other
    validations:
      required: true
  - type: textarea
    attributes:
      label: Step-by-step reproduction instructions
      placeholder: |
        1. Navigate to...
        2. Click on...
        3. See error...
    validations:
      required: true
  # Additional details
  - type: textarea
    attributes:
      label: Additional details
      description: Add any other relevant information here.
    validations:
      required: false
  - type: checkboxes
    attributes:
      label: Privacy check
      options:
        - label: I removed private content, credentials and sensitive URLs from this report.
          required: true
