name: Feature request
description: Propose an improvement to PageTrail recording, export, replay or documentation.
title: "[Feature]: "
labels: ["enhancement"]
body:
  # Context
  - type: textarea
    attributes:
      label: Context
      description: Explain the workflow or limitation that motivates this request.
      placeholder: "Now that x is done we should do y to accomplish z."
    validations:
      required: true
  # User story sentence
  - type: textarea
    attributes:
      label: What change would you like to see?
      description: Describe the solution you'd like. If relevant, include ways in which you've tried to solve the issue with the current version.
      placeholder: "As a user, I want to be able to ____ so that I can ____"
    validations:
      required: true
  # Requirements
  - type: textarea
    attributes:
      label: Requirements
      description: List the outcomes that would make this feature successful.
      placeholder: |
        1. Item metadata should show links to the collections that the item belongs to.
        2. Items can be added or removed from collections when editing an item.
    validations:
      required: false
  # Privacy and compatibility
  - type: textarea
    attributes:
      label: Privacy and compatibility considerations
      description: |
        Describe effects on browser permissions, network access, stored recordings,
        export compatibility or sensitive-data handling.
    validations:
      required: false
